[project]
name = "margin"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "JemIIahh", email = "275022204+JemIIahh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "defusedxml>=0.7.1",
    "neatlogs[anthropic,openai]>=1.4.26",
]

[project.scripts]
margin = "margin.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
