# USD per million tokens.
# Verified 2026-10-10 against https://platform.claude.com/docs/en/about-claude/pricing
# Cache writes use the 5-minute TTL rate (requests use cache_control {"type": "ephemeral"}).

[models."claude-sonnet-5-5"]
input = 2.00
output = 10.00
cache_write = 2.50     # 1.25x input (5-minute TTL)
cache_read = 0.10      # 0.05x input; Sonnet 5.5 and Opus 5.5 differ from the standard 0.1x (page footnote 2)

[models."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_write = 0.125    # 1.25x input (5-minute TTL)
cache_read = 0.01      # 0.1x input
long_prompt_threshold = 100000   # a request whose prompt is OVER 100K tokens (input + cache reads + cache writes)
long_prompt_multiplier = 5.0     # pays 5x on every category: 0.50 / 2.50 / 0.625 / 0.05
