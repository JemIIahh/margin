      svg.append(sv('path', { d: line, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      // x axis
      svg.append(sv('line', { x1: L, x2: L + pw, y1: axisY, y2: axisY, stroke: 'var(--line2)', 'stroke-width': 1.5 }));
      grid.forEach((k, i) => {
        const major = Math.abs(k * 100 % 25) < 1e-6;
        if (!major) { svg.append(sv('line', { x1: xi(i), x2: xi(i), y1: axisY, y2: axisY + 4, stroke: 'var(--line2)' })); return; }
        svg.append(sv('line', { x1: xi(i), x2: xi(i), y1: axisY, y2: axisY + 7, stroke: 'var(--ink3)' }));
        svg.append(sv('text', { x: xi(i), y: axisY + 22, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle' }, Math.round(k * 100) + '%'));
      });
      svg.append(sv('text', { x: L + pw / 2, y: axisY + 46, 'text-anchor': 'middle', class: 'ttl' }, 'Spending cap, as a share of the quoted top'));
      // each job, at the lowest cap where it still finishes
      const sorted = kstars.slice().sort((p, q) => p.k - q.k);
      const rowsLast = [-99, -99, -99, -99, -99, -99, -99, -99];
      sorted.forEach(s => {
        const xx = !isFinite(s.k) ? xk(grid[n - 1]) - 9 : s.k <= grid[0] ? xk(grid[0]) + 9 : xk(s.k);
        let r = 0; while (r < 7 && xx - rowsLast[r] < 13) r++;
        rowsLast[r] = xx;
        const cy = axisY - 13 - r * 13;
        const g = sv('g', null);
        g.append(sv('circle', { cx: xx, cy, r: 5, fill: s.solved ? 'var(--ink)' : 'var(--surface)', stroke: s.solved ? 'var(--ink)' : 'var(--ink3)', 'stroke-width': 2 }));
        g.append(sv('title', {}, s.task + (s.solved ? ': a fix that passed. It is lost if the cap is below ' : ': a job that failed. It stops early if the cap is below ') + (isFinite(s.k) ? Math.round(s.k * 100) + '% of the quote' : 'the highest setting')));
        svg.append(g);
      });
      // markers
      const rx = xi(unit), cx = xi(ci);
      if (ci !== unit) {
        svg.append(sv('circle', { cx: rx, cy: y(vals[unit]), r: 6, fill: 'var(--surface)', stroke: 'var(--ink3)', 'stroke-width': 2 }));
        svg.append(sv('text', { x: rx, y: y(vals[unit]) + 24, 'text-anchor': 'middle' }, 'recorded ' + money(vals[unit], 2)));
      }
      svg.append(sv('circle', { cx, cy: y(vals[ci]), r: 8, fill: 'var(--ink)', stroke: 'var(--surface)', 'stroke-width': 3.5 }));
      const lab = money(vals[ci], 2) + (ci === unit ? ' recorded' : '');
      svg.append(sv('text', { x: cx, y: y(vals[ci]) - 16, 'text-anchor': ci > n - 5 ? 'end' : ci < 2 ? 'start' : 'middle', class: 'strong' }, lab));
      // hover
      const guide = sv('line', { x1: 0, x2: 0, y1: T, y2: axisY, stroke: 'var(--ink3)', 'stroke-width': 1, 'stroke-dasharray': '3 4', visibility: 'hidden' });
      const hdot = sv('circle', { r: 5, fill: 'var(--bg)', stroke: 'var(--ink)', 'stroke-width': 2, visibility: 'hidden' });
      svg.append(guide, hdot);
      const hit = sv('rect', { x: L, y: T, width: pw, height: ph + 24, fill: 'transparent', style: 'cursor:pointer' });
      svg.append(hit);
      box.replaceChildren(svg);
      const tip = h('div', { class: 'tipc' });
      box.append(tip);
      const idxAt = ev => { const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * (W / r.width); return clamp(Math.round(((px - L) / pw) * (n - 1)), 0, n - 1); };
      const show = ev => {
        const i = idxAt(ev);
        guide.setAttribute('x1', xi(i)); guide.setAttribute('x2', xi(i)); guide.setAttribute('visibility', 'visible');
        hdot.setAttribute('cx', xi(i)); hdot.setAttribute('cy', y(vals[i])); hdot.setAttribute('visibility', 'visible');
        const cut = cutAt[i];
        tip.replaceChildren(h('b', { text: 'Cap at ' + Math.round(grid[i] * 100) + '% of the quote' }), 'Margin ' + money(vals[i], 2),
          h('div', { style: 'opacity:.8;margin-top:3px', text: cut.length ? plural(cut.length, 'job is', 'jobs are') + ' cut off: ' + cutLabel(cut) : 'No job is cut off' }));
        tip.style.display = 'block';
        const bx = box.getBoundingClientRect(), sx = svg.getBoundingClientRect();
        const left = (xi(i) / W) * sx.width + (sx.left - bx.left);
        tip.style.left = clamp(left - tip.offsetWidth / 2, 0, box.clientWidth - tip.offsetWidth) + 'px';
        tip.style.top = Math.max(0, (y(vals[i]) / H) * sx.height - tip.offsetHeight - 22) + 'px';
      };
      const hide = () => { guide.setAttribute('visibility', 'hidden'); hdot.setAttribute('visibility', 'hidden'); tip.style.display = 'none'; };
      hit.addEventListener('pointermove', show);
      hit.addEventListener('pointerleave', hide);
      hit.addEventListener('click', ev => { const i = idxAt(ev); dial.cap = i; cp.input.value = i; paint(); });
    }

    function paint() {
      const markup = dial.markup, ci = dial.cap, grid = D.cap_grid;
      mk.val.textContent = Math.round(markup * 100) + '%';
      cp.val.textContent = Math.round(grid[ci] * 100) + '%';
      mk.fill(); cp.fill();
      if (example) {
        mk.help.textContent = 'The price is the quoted top × (1 + markup). At ' + Math.round(markup * 100) + '%, a fix quoted up to ' + money(example.quote.hi) + ' is billed ' + money(example.quote.hi * (1 + markup)) + '.';
        cp.help.textContent = 'How much version ' + arm + ' may spend, as a share of the quoted top. At ' + Math.round(grid[ci] * 100) + '%, the same fix may spend ' + money(example.quote.hi * grid[ci]) + '. The price does not change.';
      }
      const sim = simulate(markup, ci);
      const S = {}; ARMS.forEach(a => { S[a] = sumOf(sim[a]); });
      const c = S[arm], margin = c.billed - c.cost, recMargin = recorded.billed - recorded.cost;
      const delta = (v, base, good) => {
        const d = v - base;
        if (Math.abs(d) < 1e-5) return h('div', { class: 'd same', text: 'Same as recorded' });
        return h('div', { class: 'd ' + (d * good > 0 ? 'yes' : 'no'), text: (d > 0 ? '+' : '−') + '$' + Math.abs(d).toFixed(2) + ' vs recorded' });
      };
      const kpi = (label, v, node) => h('div', { class: 'card kpi' }, h('div', { class: 'l', text: label }), h('div', { class: 'v', text: v }), node);
      kpis.replaceChildren(
        kpi('Billed, version ' + arm, money(c.billed, 2), delta(c.billed, recorded.billed, 1)),
        kpi('Model cost', money(c.cost, 2), delta(c.cost, recorded.cost, -1)),
        kpi('Margin' + (c.billed ? ', ' + pct(margin / c.billed) + ' of billed' : ''), money(margin, 2), delta(margin, recMargin, 1)));
      // the chart
      const sims = grid.map((_, k) => simulate(markup, k));
      const vals = sims.map(s => { const cs = sumOf(s[arm]); return cs.billed - cs.cost; });
      const cutAt = sims.map(s => s[arm].filter(r => r.stopped).map(r => r.task));
      const cut = sim[arm].filter(r => r.stopped);
      let take;
      if (!cut.length) take = 'At this cap every job finishes, so the cap changes nothing. Only the markup moves the margin.';
      else {
        const lost = cut.filter(r => r.rec.solved), early = cut.filter(r => !r.rec.solved);
        const saved = cut.reduce((s, r) => s + (r.rec.cost - r.cost), 0);
        take = plural(cut.length, 'job is', 'jobs are') + ' cut off by this cap. ' +
          (lost.length ? plural(lost.length, 'fix that would have passed is', 'fixes that would have passed are') + ' lost (' + money(lost.reduce((s, r) => s + r.price, 0), 2) + ' not billed). ' : '') +
          (early.length ? plural(early.length, 'job that failed stops', 'jobs that failed stop') + ' early. ' : '') +
          'Spend on the cut-off jobs falls by ' + money(saved, 2) + '.';
      }
      chartCard.replaceChildren(
        h('p', { class: 'take', text: take }),
        h('div', { class: 'legend' },
          h('span', null, h('i', { style: 'display:inline-block;width:18px;border-top:2.5px solid var(--ink)' }), 'Margin at each cap setting'),
          h('span', null, h('i', { style: 'display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink)' }), 'A fix that passed'),
          h('span', null, h('i', { style: 'display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink3)' }), 'A job that failed')),
        h('div', { class: 'plot' }),
        h('p', { class: 'note', style: 'margin-top:6px', text: 'Each dot is one job, placed at the lowest cap where it still finishes. Below that cap it is cut off.' }));
      drawChart(sims, vals, cutAt);
      // the bars
      const max = Math.max(...ARMS.map(a => Math.max(S[a].billed, S[a].cost))) * 1.04;
      barsCard.replaceChildren(legendEl([['cv', 'Cost of fixes that passed'], ['cu', 'Cost of jobs that failed'], ['mg', 'Margin kept']]),
        versionBars(barRows(a => ({ billed: S[a].billed, costV: costV(S[a]), costU: S[a].costU })), max));
      // the table
      const rows = sim[arm];
      const absMax = Math.max(...rows.map(r => Math.abs(r.margin)), ...rows.map(r => Math.abs(r.rec.margin)), 0.01);
      const changed = r => r.stopped || Math.abs(r.revenue - r.rec.revenue) > 1e-5 || Math.abs(r.cost - r.rec.cost) > 1e-5;
      const shown = onlyChanged ? rows.filter(changed) : rows;
      const body = h('tbody');
      if (!shown.length) body.append(h('tr', null, h('td', { colspan: '5', style: 'text-align:left;color:var(--ink3);padding-left:0', text: 'No job differs from the recorded run at these settings.' })));
      shown.forEach(r => {
        const w = (Math.abs(r.margin) / absMax) * 50;
        const bar = h('i', { class: r.margin < 0 ? 'n' : 'p' });
        bar.style.width = w + '%';
        body.append(h('tr', { class: changed(r) ? 'chd' : '' },
          h('td', { text: r.task }),
          h('td', { class: 'res' }, r.stopped ? h('span', { class: 'chip cut', text: 'Cut off at the cap' }) : h('span', { class: 'chip ' + (r.solved ? 'ok' : 'no'), text: r.solved ? '✓ Verified' : '✕ Not verified' })),
          h('td', { class: 'hide-s', text: money(r.revenue) }), h('td', { class: 'hide-s', text: money(r.cost) }),
          h('td', { class: 'mbar' }, h('div', { class: 'dv' }, h('div', { class: 'dz' }, bar), h('span', { class: r.margin < 0 ? 'neg' : '', text: money(r.margin) })))));
      });
      tableCard.replaceChildren(
        h('div', { class: 'pj-top' }, h('div', { class: 'legend' },
          h('span', null, h('i', { class: 'sw mg' }), 'Margin kept'), h('span', null, h('i', { class: 'sw', style: 'background:var(--bad)' }), 'Loss')),
        h('div', { class: 'seg', role: 'group', 'aria-label': 'Which jobs to show' },
          [[false, 'All jobs'], [true, 'Only those that changed']].map(o => h('button', { type: 'button', 'aria-pressed': String(onlyChanged === o[0]), onclick: () => { onlyChanged = o[0]; paint(); } }, o[1])))),
        h('div', { class: 'tablewrap' }, h('table', null,
          h('thead', null, h('tr', null, [['Issue', ''], ['Result', 'res'], ['Billed', 'hide-s'], ['Cost', 'hide-s'], ['Margin', 'mb2']].map(t => h('th', { class: t[1], scope: 'col', text: t[0] })))), body)));
    }
    mk.input.addEventListener('input', () => { dial.markup = parseInt(mk.input.value, 10) / 100; paint(); });
    cp.input.addEventListener('input', () => { dial.cap = parseInt(cp.input.value, 10); paint(); });
    paint();
    if (dialRO) dialRO.disconnect();
    if (window.ResizeObserver) {
      let last = chartCard.clientWidth;
      dialRO = new ResizeObserver(() => { if (Math.abs(chartCard.clientWidth - last) > 2) { last = chartCard.clientWidth; paint(); } });
      dialRO.observe(chartCard);
    }
  }

  /* ---------- router ---------- */
  function applyRoute() {
    const r = parseHash();
    if (DM && DM.raf) { cancelAnimationFrame(DM.raf); DM.playing = false; }
    if (dialRO) { dialRO.disconnect(); dialRO = null; }
    document.querySelectorAll('#nav a').forEach(a => {
      if (a.getAttribute('data-view') === r.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (r.view === 'proof') { DM = null; renderProof(); window.scrollTo(0, 0); }
    else if (r.view === 'dials') { DM = null; renderDials(); window.scrollTo(0, 0); }
    else {
      const first = bootAuto; bootAuto = false;
      openDemo(r.run || lastRun || DEFAULT_RUN, { paused: !first && !r.run ? false : false });
      if (!r.run) window.scrollTo(0, 0);
    }
  }
  window.addEventListener('hashchange', applyRoute);
  document.addEventListener('keydown', onKey);
  buildHeader();
  applyRoute();
})();
</script>
</body>
</html>
